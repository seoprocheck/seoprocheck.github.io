<script>
const loremWords = 'lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor incididunt ut labore et dolore magna aliqua ut enim ad minim veniam quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur excepteur sint occaecat cupidatat non proident sunt in culpa qui officia deserunt mollit anim id est laborum'.split(' ');
function getRandomWords(count) {
    let result = [];
    for (let i = 0; i < count; i++) {
        result.push(loremWords[Math.floor(Math.random() * loremWords.length)]);
    }
    result[0] = result[0].charAt(0).toUpperCase() + result[0].slice(1);
    return result.join(' ') + '.';
}
function generateLorem() {
    const count = Math.min(20, Math.max(1, parseInt(document.getElementById('lorem-count').value) || 1));
    document.getElementById('lorem-count').value = count;
    const type = document.getElementById('lorem-type').value;
    let output = '';
    if (type === 'paragraphs') {
        for (let i = 0; i < count; i++) {
            let para = '';
            const sentences = Math.floor(Math.random() * 4) + 4;
            for (let j = 0; j < sentences; j++) {
                para += getRandomWords(Math.floor(Math.random() * 10) + 8) + ' ';
            }
            output += para.trim() + '\n\n';
        }
    } else if (type === 'sentences') {
        for (let i = 0; i < count; i++) {
            output += getRandomWords(Math.floor(Math.random() * 10) + 8) + ' ';
        }
    } else {
        let words = [];
        for (let i = 0; i < count; i++) {
            words.push(loremWords[Math.floor(Math.random() * loremWords.length)]);
        }
        output = words.join(' ');
    }
    document.getElementById('lorem-output').style.display = 'block';
    document.getElementById('lorem-output').textContent = output.trim();
}
function copyLorem() {
    const copied = document.getElementById('lorem-output').textContent;
    if (!copied || !String(copied).trim()) { alert('Nothing to copy yet: generate the result first.'); return; }
    navigator.clipboard.writeText(copied);
    alert('Copied!');
}
