<div class="wrap crumb"><a href="/">← All tools</a></div>
<div class="wrap toolhead"><h1>FAQ Schema Generator</h1><p>Build FAQPage JSON-LD from your questions and answers in seconds.</p></div>
<div class="wrap toolstage">
<div class="spc-tool-wrapper" id="faq-schema">
<h3>FAQ Schema Generator</h3>
<div id="faq-items">
    <div class="spc-field faq-item">
        <label>Question 1</label>
        <input type="text" class="faq-q" placeholder="Enter your question">
        <label style="margin-top:10px;">Answer 1</label>
        <textarea class="faq-a" placeholder="Enter the answer"></textarea>
    </div>
</div>
<div class="spc-actions">
    <button onclick="addFaqItem()">+ Add Question</button>
    <button onclick="generateFaqSchema()">Generate Schema</button>
    <button class="spc-btn-secondary" onclick="copyFaqSchema()">Copy JSON-LD</button>
</div>
<div class="spc-output" id="faq-output" style="display:none;"></div>
</div>
<script>
let faqCount = 1;
function addFaqItem() {
    faqCount++;
    const container = document.getElementById('faq-items');
    const div = document.createElement('div');
    div.className = 'spc-field faq-item';
    div.innerHTML = `<hr><label>Question ${faqCount}</label><input type="text" class="faq-q" placeholder="Enter your question"><label style="margin-top:10px;">Answer ${faqCount}</label><textarea class="faq-a" placeholder="Enter the answer"></textarea>`;
    container.appendChild(div);
}
function generateFaqSchema() {
    const questions = document.querySelectorAll('.faq-q');
    const answers = document.querySelectorAll('.faq-a');
    const mainEntity = [];
    questions.forEach((q, i) => {
        if (q.value && answers[i].value) {
            mainEntity.push({
                "@type": "Question",
                "name": q.value,
                "acceptedAnswer": {"@type": "Answer", "text": answers[i].value}
            });
        }
    });
    const schema = {"@context": "https://schema.org", "@type": "FAQPage", "mainEntity": mainEntity};
    const output = document.getElementById('faq-output');
    output.style.display = 'block';
    output.textContent = '<script type="application/ld+json">\n' + JSON.stringify(schema, null, 2) + '\n<\/script>';
}
function copyFaqSchema() {
    navigator.clipboard.writeText(document.getElementById('faq-output').textContent);
    alert('Copied to clipboard!');
}
</script>
