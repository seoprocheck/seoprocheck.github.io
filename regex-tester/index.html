<div class="wrap toolhead"><h1>Regex Tester</h1><p>Test regular expressions against sample text live.</p></div>
<div class="wrap toolstage">
<div class="spc-tool-wrapper" id="regex-tester">
<h3>Regular Expression Tester</h3>
<div class="spc-row">
    <div class="spc-field" style="flex:2;">
        <label>Regular Expression</label>
        <input type="text" id="regex-pattern" placeholder="[a-z]+@[a-z]+\.[a-z]+" oninput="testRegex()">
    </div>
    <div class="spc-field" style="flex:1;">
        <label>Flags</label>
        <div class="spc-checkbox-group" style="display:flex;gap:15px;">
            <label><input type="checkbox" id="flag-g" checked onchange="testRegex()"> g</label>
            <label><input type="checkbox" id="flag-i" onchange="testRegex()"> i</label>
            <label><input type="checkbox" id="flag-m" onchange="testRegex()"> m</label>
        </div>
    </div>
</div>
<div class="spc-field">
    <label>Test String</label>
    <textarea id="regex-test" placeholder="Enter text to test against the pattern..." style="min-height:120px;" oninput="testRegex()"></textarea>
</div>
<div id="regex-results" style="margin-top:20px;"></div>
</div>
<script>
function testRegex() {
    const pattern = document.getElementById('regex-pattern').value;
    const testStr = document.getElementById('regex-test').value;
    if (!pattern || !testStr) {
        document.getElementById('regex-results').innerHTML = '';
        return;
    }
    let flags = '';
    if (document.getElementById('flag-g').checked) flags += 'g';
    if (document.getElementById('flag-i').checked) flags += 'i';
    if (document.getElementById('flag-m').checked) flags += 'm';
    try {
        const regex = new RegExp(pattern, flags);
        const matches = testStr.match(regex);
        let html = '';
        if (matches && matches.length > 0) {
            html = `<div class="spc-success">✅ ${matches.length} match${matches.length > 1 ? 'es' : ''} found</div>`;
            html += '<div class="spc-preview-box" style="margin-top:15px;"><strong>Matches:</strong><ul style="margin:10px 0 0 20px;">';
            matches.forEach((m, i) => {
                html += `<li><code>${m}</code></li>`;
            });
            html += '</ul></div>';
            let highlighted = testStr.replace(regex, '<mark style="background:#815be0;color:#fff;padding:1px 3px;border-radius:3px;">$&</mark>');
            html += '<div class="spc-preview-box" style="margin-top:15px;"><strong>Highlighted:</strong><div style="margin-top:10px;white-space:pre-wrap;">' + highlighted + '</div></div>';
        } else {
            html = '<div class="spc-error">❌ No matches found</div>';
        }
        document.getElementById('regex-results').innerHTML = html;
    } catch(e) {
        document.getElementById('regex-results').innerHTML = `<div class="spc-error">❌ Invalid regex: ${e.message}</div>`;
    }
}
</script>
