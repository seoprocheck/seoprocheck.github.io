<div class="wrap toolhead"><h1>Local Business Schema Generator</h1><p>Build LocalBusiness schema with NAP, hours and geo data.</p></div>
<div class="wrap toolstage">
<div class="spc-tool-wrapper" id="local-schema">
<h3>Local Business Schema Generator</h3>
<div class="spc-row">
    <div class="spc-field">
        <label>Business Name</label>
        <input type="text" id="lb-name" placeholder="Your Business Name">
    </div>
    <div class="spc-field">
        <label>Business Type</label>
        <select id="lb-type">
            <option value="LocalBusiness">Local Business (General)</option>
            <option value="Restaurant">Restaurant</option>
            <option value="Store">Store</option>
            <option value="ProfessionalService">Professional Service</option>
            <option value="HealthAndBeautyBusiness">Health & Beauty</option>
            <option value="HomeAndConstructionBusiness">Home & Construction</option>
            <option value="LegalService">Legal Service</option>
            <option value="FinancialService">Financial Service</option>
            <option value="MedicalBusiness">Medical Business</option>
            <option value="Dentist">Dentist</option>
            <option value="RealEstateAgent">Real Estate Agent</option>
            <option value="AutoRepair">Auto Repair</option>
        </select>
    </div>
</div>
<div class="spc-field">
    <label>Street Address</label>
    <input type="text" id="lb-street" placeholder="123 Main Street, Suite 100">
</div>
<div class="spc-row">
    <div class="spc-field">
        <label>City</label>
        <input type="text" id="lb-city" placeholder="City">
    </div>
    <div class="spc-field">
        <label>State/Region</label>
        <input type="text" id="lb-state" placeholder="TX">
    </div>
    <div class="spc-field">
        <label>Postal Code</label>
        <input type="text" id="lb-zip" placeholder="75001">
    </div>
    <div class="spc-field">
        <label>Country (two-letter code)</label>
        <input type="text" id="lb-country" value="US" maxlength="2" placeholder="US">
    </div>
</div>
<div class="spc-row">
    <div class="spc-field">
        <label>Phone</label>
        <input type="text" id="lb-phone" placeholder="+1-555-123-4567">
    </div>
    <div class="spc-field">
        <label>Website</label>
        <input type="url" id="lb-url" placeholder="https://yourbusiness.com">
    </div>
</div>
<div class="spc-row">
    <div class="spc-field">
        <label>Price Range</label>
        <select id="lb-price">
            <option value="">Select...</option>
            <option value="$">$ (Budget)</option>
            <option value="$$">$$ (Moderate)</option>
            <option value="$$$">$$$ (Expensive)</option>
            <option value="$$$$">$$$$ (Luxury)</option>
        </select>
    </div>
    <div class="spc-field">
        <label>Logo URL</label>
        <input type="url" id="lb-logo" placeholder="https://yourbusiness.com/logo.png">
    </div>
</div>
<div class="spc-field">
    <label>Opening Hours (e.g., Mo-Fr 09:00-17:00)</label>
    <input type="text" id="lb-hours" placeholder="Mo-Fr 09:00-17:00, Sa 10:00-14:00">
</div>
<div class="spc-actions">
    <button onclick="generateLocalSchema()">Generate Schema</button>
    <button class="spc-btn-secondary" onclick="copyLocalSchema()">Copy JSON-LD</button>
</div>
<div class="spc-output" id="lb-output" style="display:none;"></div>
</div>
<script>
function generateLocalSchema() {
    const schema = {
        "@context": "https://schema.org",
        "@type": document.getElementById('lb-type').value,
        "name": document.getElementById('lb-name').value,
        "address": {
            "@type": "PostalAddress",
            "streetAddress": document.getElementById('lb-street').value,
            "addressLocality": document.getElementById('lb-city').value,
            "addressRegion": document.getElementById('lb-state').value,
            "postalCode": document.getElementById('lb-zip').value,
            "addressCountry": (document.getElementById('lb-country').value.trim().toUpperCase() || 'US')
        },
        "telephone": document.getElementById('lb-phone').value,
        "url": document.getElementById('lb-url').value
    };
    const price = document.getElementById('lb-price').value;
    if (price) schema.priceRange = price;
    const logo = document.getElementById('lb-logo').value;
    if (logo) schema.logo = logo;
    const hours = document.getElementById('lb-hours').value;
    if (hours) schema.openingHours = hours;
    Object.keys(schema).forEach(k => {
        if (!schema[k] || (typeof schema[k] === 'object' && !Object.values(schema[k]).some(v => v))) {
            delete schema[k];
        }
    });
    const output = document.getElementById('lb-output');
    output.style.display = 'block';
    output.textContent = '<script type="application/ld+json">\n' + JSON.stringify(schema, null, 2) + '\n<\/script>';
}
function copyLocalSchema() {
    navigator.clipboard.writeText(document.getElementById('lb-output').textContent);
    alert('Copied!');
}
</script>
